<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            color: white;
            font-family: "Lora", serif;
            font-size: 20px;
            font-weight: 700;
        }

        .thanh-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding-bottom: 33px;
            border-radius: 16px;
        }

        .nhan-hieu,
        .menu,
        .nut {
            height: 0.8vw;
            background: #272b2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            gap: 30px;
            border-radius: 16px;
        }

        .nhan-hieu {
            height: 60px;
            width: 200px;
        }

        .menu {
            height: 34px;
            width: 820px;
        }

        .nut {
            width: 120px;
            height: 42px;
            padding: 0;
            border: 0;
        }

        .gioi-thieu {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1f2324;
            gap: 30px;
            padding: 80px;
        }

        .noi-dung,
        .hinh-anh {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #272b2e;
            padding: 40px;
            border-radius: 16px;
        }

        .noi-dung {
            width: 585px;
            height: 267px;
        }

        .hinh-anh {
            width: 585px;
            height: 520px;
        }

        .phan,
        .vung-hai {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding-top: 40px;
        }
        .vung-hai {
            width: 100%;
            background: #1f2324;
        }

        .tieu-de {
            width: 600px;
            height: 80px;
            padding: 27px 278px;
            background: #272b2e;
            text-align: center;
            border-radius: 16px;
        }

        .danh-sach {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            height: fit-content;
            width: 1366px;
            padding-bottom: 80px;
        }

        .item {
            background: #272b2e;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
        }

        .ba-item .item {
            width: 380px;
            height: 420px;
            gap: 30px;
        }

        .nam-item .item {
           width: 216px;
           height: 300px;
        }

        .bon-item .item {
            width: 277.5px;
            height: 300px;
        }

        footer {
            margin-top: auto;
            background: #272b2e;
            text-align: center;
            padding: 24px 649px;
        }
    </style>
</head>
<body>
    <div class="thanh-menu">
        <div class="nhan-hieu">Logo</div>
        <div class="menu">Menu</div>
        <button class="nut">Button</button>
    </div>
    <div class="gioi-thieu">
        <div class="noi-dung">Content</div>
        <div class="hinh-anh">Image</div>
    </div>
    <div class="phan">
        <div class="tieu-de">Title</div>
        <div class="danh-sach ba-item">
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
        </div>
    </div>
    <div class="vung-hai">
        <div class="tieu-de">Title</div>
        <div class="danh-sach nam-item">
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
        </div>
    </div>
    <div class="phan">
        <div class="tieu-de">Title</div>
        <div class="danh-sach bon-item">
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
        </div>
    </div>
    <footer>
        <div>Footer</div>
    </footer>    
</body>
</html>
